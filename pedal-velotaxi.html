<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Педаль — велотакси</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Макет: мобильное приложение, на ПК сетка карточек. Шапка с «бургером» слева, шторка расстояния выезжает слева. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --ink:#0E1A2B; --muted:#5B6B80; --line:#D8E0E9;
  --accent:#FF5B1F; --accent-ink:#FFFFFF; --accent-soft:#FFE6DC; --ok:#16995A; --danger:#D6362B;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 8px 24px rgba(14,26,43,.08);
  --f-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1320; --surface:#131E30; --ink:#EAF0F7; --muted:#93A3B8; --line:#243349;
    --accent:#FF7A45; --accent-ink:#1A0B03; --accent-soft:#3A2318; --ok:#3CC885; --danger:#FF6B5E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1320; --surface:#131E30; --ink:#EAF0F7; --muted:#93A3B8; --line:#243349;
  --accent:#FF7A45; --accent-ink:#1A0B03; --accent-soft:#3A2318; --ok:#3CC885; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
.muted{color:var(--muted)}

/* кнопки и поля */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font-weight:800;background:var(--accent);color:var(--accent-ink);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
label.f{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-weight:500;color:var(--ink)}
textarea.inp{min-height:96px;resize:vertical}
.err{color:var(--danger);font-weight:700;font-size:13px;min-height:18px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* вход и регистрация */
.auth{max-width:460px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top,0px)) 24px;display:grid;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:20px}
.brand svg{width:36px;height:36px}
.auth h1{font-size:clamp(26px,7vw,34px);line-height:1.12}
.card-panel{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:14px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:10px;font-weight:800;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{position:relative;border:1.5px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:4px;background:var(--surface);cursor:pointer}
.role input{position:absolute;opacity:0}
.role b{font-weight:800}.role span{font-size:13px;color:var(--muted)}
.role:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.role:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.hint{font-size:12.5px;color:var(--muted)}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.burger{width:46px;height:46px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-content:center;gap:5px}
.burger i{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--ink)}
.top .brand{font-size:17px}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--muted)}
.seg{display:flex;gap:8px;overflow-x:auto;padding-block:4px 14px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .chip{white-space:nowrap}
.head-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:4px 14px}
.head-row h2{font-size:20px}

/* карточки водителей */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.dcard{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:0;padding:0;text-align:left;display:grid;min-width:0}
.dcard:hover{transform:translateY(-2px)}
.mosaic{display:grid;gap:3px;aspect-ratio:4/3;background:var(--line)}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block;min-width:0;min-height:0}
.m1{grid-template-columns:1fr}
.m2{grid-template-columns:1fr 1fr}
.m3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.m3 img:first-child{grid-row:span 2}
.dcard .info{padding:12px 14px 14px;display:grid;gap:8px}
.dcard .nm{font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dist{font-size:13px;font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;background:var(--bg);border-radius:8px;padding:4px 8px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--surface);border-radius:20px;display:grid;gap:8px}
.empty b{color:var(--ink);font-size:17px}

/* шторка */
#scrim{position:fixed;inset:0;background:rgba(5,10,18,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);background:var(--surface);z-index:21;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);
  padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overflow-y:auto;box-shadow:var(--shadow)}
#drawer.on{transform:none}
#drawer h3{font-size:16px}
.d-block{display:grid;gap:10px}
.d-user{display:grid;gap:2px}
.d-user b{font-size:17px}
.row{display:flex;gap:8px}
.row>.inp{min-width:0}
.row select.inp{width:auto}
.foot{margin-top:auto;display:grid;gap:8px}

/* модалка водителя */
dialog{border:0;padding:0;border-radius:24px;max-width:min(520px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(5,10,18,.6)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;aspect-ratio:4/3;object-fit:cover;scroll-snap-align:center}
.m-body{padding:18px 20px 22px;display:grid;gap:14px}
.m-body h2{font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-weight:700}.kv dd{margin:0;font-weight:700}
.x{position:absolute;right:10px;top:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(10,16,26,.65);color:#fff;font-size:20px}
.mwrap{position:relative}
.count{position:absolute;left:12px;bottom:10px;background:rgba(10,16,26,.65);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800}

/* анкета водителя */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph{aspect-ratio:1;border-radius:14px;border:1.5px dashed var(--line);display:grid;place-items:center;position:relative;overflow:hidden;background:var(--bg);color:var(--muted);font-weight:800;font-size:12px;text-align:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph button{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(10,16,26,.7);color:#fff}
.ph.add{cursor:pointer;border-color:var(--accent);color:var(--accent)}
.sizes{display:grid;gap:8px}
.size{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.size:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.size input{accent-color:var(--accent)}
.size small{color:var(--muted);display:block;font-weight:500}
.chk{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;font-weight:700}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk input{accent-color:var(--accent);width:18px;height:18px}
.geo-ico{width:72px;height:72px;border-radius:22px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.geo-ico svg{width:38px;height:38px}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:700;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.top{padding-block:18px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="scrim"></div>
<aside id="drawer" aria-label="Меню" aria-hidden="true"></aside>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>

<script>
/* ===================== Хелперы ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem = {}; // запасное хранилище, если localStorage недоступен (предпросмотр, приватный режим)
const store = {
  get(k, d) {
    try { const v = localStorage.getItem(k); return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v); }
    catch { return k in mem ? mem[k] : d; }
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* работаем из памяти до закрытия вкладки */ }
    return true;
  }
};
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
async function sha256(s) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch { /* небезопасный контекст, используем запасной хеш */ }
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'f' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
}
const shortName = (n, s) => `${n} ${(s || '').trim().charAt(0).toUpperCase()}.`;
const fullName = u => `${u.name} ${u.surname}`;
function haversine(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? `${Math.max(10, Math.round(m / 10) * 10)} м` : `${(m / 1000).toFixed(1).replace('.', ',')} км`;

/* ===================== Справочники ===================== */
const SECTIONS = { all: 'Все', bmx: 'BMX', rack: 'Велобагажник' };
const BIKE_TYPES = ['Городской', 'BMX', 'Грузовой (карго)', 'Горный', 'Шоссейный', 'Электровелосипед', 'Фэтбайк'];
const SIZES = {
  S: ['Компактный', 'колёса 16–20″, для одного пассажира налегке'],
  M: ['Стандартный', 'колёса 24–27,5″, обычный багажник'],
  L: ['Большой', 'колёса 28–29″ или карго, много места для груза']
};
const DEMO_CENTER = { lat: 55.7558, lng: 37.6173 };

/* ===================== Состояние ===================== */
let users = store.get('pedal.users', []);
let session = store.get('pedal.session', null);
let pos = store.get('pedal.pos', null);       // {lat,lng,demo}
let view = 'auth';
let authTab = 'login';
let section = 'all';
let radius = store.get('pedal.radius', null);  // метры или null = любое
let draft = null;                              // анкета водителя в процессе
const me = () => users.find(u => u.email === session);
const saveUsers = () => store.set('pedal.users', users);

/* ===================== Фото-заглушки для демо-водителей ===================== */
function bikeSvg(kind, i) {
  const pal = [['#FFD9C7','#FF5B1F'],['#D6E8FF','#1F6FE0'],['#D5F2E3','#14925A'],['#FFF0C2','#C98A00'],['#E3E8F0','#35465E'],['#FFD6E0','#D1325E']][i % 6];
  const bmx = kind === 'bmx', rack = kind === 'rack';
  const r = bmx ? 52 : 62, y = 210;
  const x1 = 120, x2 = 120 + (bmx ? 190 : 230);
  const fx = x1 + (x2 - x1) * .42, top = y - (bmx ? 95 : 105);
  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><rect width="400" height="300" fill="${pal[0]}"/>`;
  s += `<rect y="${y + r}" width="400" height="${300 - y - r}" fill="${pal[1]}" opacity=".18"/>`;
  s += `<g fill="none" stroke="#14202F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">`;
  s += `<circle cx="${x1}" cy="${y}" r="${r}"/><circle cx="${x2}" cy="${y}" r="${r}"/>`;
  s += `<path stroke="${pal[1]}" d="M${x1} ${y} L${fx} ${top} L${x2 - 38} ${top} L${x2} ${y} M${fx} ${top} L${(x1 + x2) / 2 - 4} ${y} L${x1} ${y} M${(x1 + x2) / 2 - 4} ${y} L${x2 - 38} ${top}"/>`;
  s += `<path d="M${x2 - 38} ${top} L${x2 - 44} ${top - 26} M${x2 - 62} ${top - 28} L${x2 - 28} ${top - 28} M${fx} ${top} L${fx - 8} ${top - 20} M${fx - 26} ${top - 22} L${fx + 12} ${top - 22}"/>`;
  if (rack) s += `<path stroke="${pal[1]}" d="M${x1 - 10} ${y - 62} H${fx + 12} M${x1 + 24} ${y - 62} L${x1 + 6} ${y - 18}"/><rect x="${x1 - 22}" y="${y - 96}" width="86" height="30" rx="6" fill="${pal[1]}" stroke="none" opacity=".85"/>`;
  s += `</g></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(s);
}

/* ===================== Демо-водители вокруг пассажира ===================== */
const DEMO = [
  ['Георгий','Жилин','Городской','M',['all'],'Езжу по центру уже три года, знаю все короткие пути и дворы. Аккуратный, не гоняю.',1,'urban'],
  ['Анна','Королёва','Велобагажник','M',['rack'],'Мягкая подушка на багажнике, подножки для ног. Довезу с сумками и покупками.',2,'rack'],
  ['Тимур','Беляев','BMX','S',['bmx'],'BMX с пегами. Быстро, весело, только для лёгких пассажиров и коротких поездок.',3,'bmx'],
  ['Марина','Соколова','Электровелосипед','L',['all','rack'],'Электро с запасом хода 60 км, плавный старт. Подходит для подъёмов и длинных маршрутов.',2,'rack'],
  ['Денис','Орлов','BMX','S',['bmx','all'],'Катаю на BMX пять лет. Беру пассажиров на пеги, шлем даю.',2,'bmx'],
  ['Илья','Мартынов','Грузовой (карго)','L',['rack'],'Карго-байк с широкой платформой. Помещаются двое или пассажир с чемоданом.',3,'rack'],
  ['Полина','Громова','Городской','M',['all'],'Спокойная езда, без лихачества. Есть звонок, фонари и светоотражатели.',1,'urban'],
  ['Артём','Зайцев','Горный','L',['all','bmx'],'Горный велосипед, проеду по бордюрам и грунту. Подвезу туда, куда такси не доедет.',2,'urban'],
  ['Кирилл','Фомин','Велобагажник','M',['rack'],'Усиленный багажник до 90 кг, мягкое сиденье.',1,'rack'],
  ['Софья','Лебедева','Шоссейный','S',['all'],'Шоссейник, самая быстрая в районе. Подвозить могу одного лёгкого человека.',1,'urban'],
  ['Максим','Ильин','Фэтбайк','L',['all','bmx'],'Фэтбайк на толстых шинах, едет по снегу и лужам. Устойчивый, подходит новичкам.',2,'urban'],
  ['Егор','Вакуленко','Городской','M',['all','rack'],'Работаю по вечерам. Багажник с мягким сиденьем, дождевик для пассажира в запасе.',3,'rack']
];
const DEMO_R = [180, 320, 430, 560, 690, 780, 920, 1080, 1250, 1420, 1700, 2100];
function demoDrivers(center) {
  return DEMO.map((d, i) => {
    const a = (i * 137.5) * Math.PI / 180, r = DEMO_R[i];
    const dLat = r * Math.cos(a) / 111320, dLng = r * Math.sin(a) / (111320 * Math.cos(center.lat * Math.PI / 180));
    const photos = Array.from({ length: d[6] }, (_, k) => bikeSvg(d[7], i + k * 2));
    return { id: 'demo' + i, demo: true, name: d[0], surname: d[1], driver: { bikeType: d[2], size: d[3], dims: '', sections: d[4], desc: d[5], photos }, pos: { lat: center.lat + dLat, lng: center.lng + dLng } };
  });
}
function allDrivers() {
  const real = users.filter(u => u.role === 'driver' && u.driver && u.online !== false && u.pos && u.email !== session)
    .map(u => ({ id: u.email, name: u.name, surname: u.surname, driver: u.driver, pos: u.pos }));
  return [...real, ...demoDrivers(pos || DEMO_CENTER)];
}

/* ===================== Геолокация ===================== */
function askLocation() {
  return new Promise(res => {
    if (!navigator.geolocation) return res({ error: 'Браузер не поддерживает геолокацию.' });
    navigator.geolocation.getCurrentPosition(
      p => res({ pos: { lat: p.coords.latitude, lng: p.coords.longitude, demo: false } }),
      e => res({ error: e.code === 1 ? 'Доступ к геолокации запрещён. Откройте файл в Chrome и разрешите доступ (в окне предпросмотра он не работает).' : 'Не удалось определить местоположение.' }),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 }
    );
  });
}
let watchId = null, lastWrite = 0;
function startDriverWatch() {
  if (!navigator.geolocation || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition(p => {
    const u = me(); if (!u || u.role !== 'driver') return;
    const now = Date.now(); if (now - lastWrite < 5000) return; lastWrite = now;
    u.pos = { lat: p.coords.latitude, lng: p.coords.longitude, demo: false };
    pos = u.pos; saveUsers(); store.set('pedal.pos', pos);
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
}
function stopWatch() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }

async function onAuth(form) {
  const f = new FormData(form), err = $('#authErr');
  err.textContent = '';
  const email = (f.get('email') || '').trim().toLowerCase(), password = f.get('password') || '';
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(email)) return err.textContent = 'Введите корректный адрес почты.';
  if (password.length < 6) return err.textContent = 'Пароль должен быть не короче 6 символов.';
  const hash = await sha256(password);
  if (authTab === 'login') {
    const u = users.find(x => x.email === email && x.hash === hash);
    if (!u) return err.textContent = 'Неверная почта или пароль.';
    session = email; store.set('pedal.session', session);
    return go(u.role === 'driver' && !u.driver ? 'setup' : 'geo');
  }
  const name = (f.get('name') || '').trim(), surname = (f.get('surname') || '').trim();
  if (!name || !surname) return err.textContent = 'Укажите имя и фамилию.';
  if (users.some(x => x.email === email)) return err.textContent = 'Эта почта уже зарегистрирована. Войдите в аккаунт.';
  /* TODO: на сервере здесь нужно отправить письмо с кодом подтверждения почты */
  users.push({ email, hash, name, surname, role: f.get('role'), online: true });
  saveUsers(); session = email; store.set('pedal.session', session);
  go(f.get('role') === 'driver' ? 'setup' : 'geo');
}

  });

function drawPhotos() {
  const box = $('#photos'); if (!box) return;
  let h = draft.photos.map((p, i) => `<div class="ph"><img src="${p}" alt="Фото ${i + 1}"><button type="button" data-rm="${i}" aria-label="Удалить фото ${i + 1}">×</button></div>`).join('');

  box.innerHTML = h;
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { draft.photos.splice(+b.dataset.rm, 1); drawPhotos(); });

function resizeImage(file, max = 760) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function onSetup(form) {

  const u = me(), first = !u.driver;
  u.driver = { sections, bikeType: bike, size, dims: (f.get('dims') || '').trim(), desc: (f.get('desc') || '').trim(), photos: draft.photos };
  if (!saveUsers()) return;
  draft = null; go(first ? 'geo' : 'home');
}

  d.classList.add('on'); $('#scrim').classList.add('on');
  d.setAttribute('aria-hidden', 'false'); const b = $('#burger'); if (b) b.setAttribute('aria-expanded', 'true');
  $('#scrim').onclick = closeDrawer;
  $('#dLogout').onclick = () => { stopWatch(); session = null; store.set('pedal.session', null); authTab = 'login'; section = 'all'; go('auth'); };
  if (drv) return;
  d.querySelectorAll('[data-r]').forEach(c => c.onclick = () => setRadius(c.dataset.r === 'any' ? null : +c.dataset.r));
  $('#cApply').onclick = () => {
    const v = parseFloat(String($('#cVal').value).replace(',', '.')), m = $('#cUnit').value === 'km' ? v * 1000 : v;
    if (!isFinite(m) || m < 50 || m > 50000) return $('#cErr').textContent = 'Введите расстояние от 50 м до 50 км.';
    setRadius(Math.round(m));
  };
  $('#dRelocate').onclick = async () => {
    const r = await askLocation(); if (r.error) return toast(r.error);
    setPos(r.pos); closeDrawer(); renderHome($('#app')); toast('Местоположение обновлено');
  };
}
function setRadius(r) { radius = r; store.set('pedal.radius', r); closeDrawer(); renderHome($('#app')); }
function closeDrawer() {
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true');
  const b = $('#burger'); if (b) b.setAttribute('aria-expanded', 'false');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ===================== Старт ===================== */
(function init() {
  const u = me();
  if (!u) { session = null; return go('auth'); }
  if (u.role === 'driver' && !u.driver) return go('setup');
  if (pos) { go('home'); askLocation().then(r => { if (r.pos) { setPos(r.pos); if (view === 'home') render(); } }); }
  else go('geo');
})();
</script>
</body>
